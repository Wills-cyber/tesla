<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration of a performance electric sedan in side profile">
  <title>Performance electric sedan — placeholder illustration</title>
  <desc>Line-art side profile of a long, low performance electric sedan with a liftback roofline. Replace with licensed photography; see src/config/vehicles.ts.</desc>

  <defs>
    <linearGradient id="ps-body" x1="160" y1="400" x2="1480" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE3C6" stop-opacity="0.9"/>
