<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration of an electric crossover SUV in side profile">
  <title>Electric crossover SUV — placeholder illustration</title>
  <desc>Line-art side profile of an electric crossover SUV with a raised roofline. Replace with licensed photography; see src/config/vehicles.ts.</desc>

  <defs>
    <linearGradient id="su-body" x1="200" y1="320" x2="1450" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE3C6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#CBA96A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8E7746" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="su-detail" x1="200" y1="480" x2="1450" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="su-glass" x1="640" y1="290" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBA96A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="su-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="800" cy="756" rx="560" ry="40" fill="url(#su-contact)"/>

