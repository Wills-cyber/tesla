<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration of an angular electric light truck in side profile">
  <title>Electric light truck — placeholder illustration</title>
  <desc>Line-art side profile of an angular, exoskeleton-style electric light truck. Replace with licensed photography; see src/config/vehicles.ts.</desc>

  <defs>
    <linearGradient id="tk-body" x1="180" y1="300" x2="1460" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFE3C6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#CBA96A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8E7746" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="tk-detail" x1="180" y1="480" x2="1460" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="tk-glass" x1="560" y1="300" x2="1020" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBA96A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="tk-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="800" cy="752" rx="580" ry="40" fill="url(#tk-contact)"/>

  <!-- Single-wedge exoskeleton profile: two straight planes, no curves -->
  <path
    d="M198 604
       L 198 552
       L 606 340
       L 1000 306
       L 1462 470
       L 1462 636
       C 1462 650 1454 656 1436 656
       L 1296 656
       A 112 112 0 0 0 1072 656
       L 604 656
       A 112 112 0 0 0 380 656
       L 198 654 Z"
    fill="none" stroke="url(#tk-body)" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Windscreen and side glass, following the same wedge -->
  <path d="M612 384 L 996 350 L 1236 436 L 668 436 Z"
        fill="url(#tk-glass)" stroke="url(#tk-detail)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M896 358 L 896 436" stroke="url(#tk-detail)" stroke-width="1.8"/>

  <!-- Bed break -->
  <path d="M1236 436 L 1462 470" stroke="url(#tk-detail)" stroke-width="1.8"/>
  <path d="M1244 436 L 1244 656" stroke="url(#tk-detail)" stroke-width="1.6"/>

  <!-- Belt line + door cuts -->
  <path d="M204 552 L 1456 486" stroke="url(#tk-detail)" stroke-width="1.6"/>
  <path d="M668 436 L 668 656" stroke="url(#tk-detail)" stroke-width="1.6"/>
  <path d="M956 436 L 956 656" stroke="url(#tk-detail)" stroke-width="1.6"/>

  <!-- Rocker plane -->
  <path d="M240 612 L 1420 612" stroke="url(#tk-detail)" stroke-width="1.4" stroke-dasharray="16 12"/>

  <rect x="800" y="500" width="52" height="8" rx="4" fill="#CBA96A" fill-opacity="0.45"/>
  <rect x="1088" y="500" width="52" height="8" rx="4" fill="#CBA96A" fill-opacity="0.45"/>

  <!-- Light bars -->
  <path d="M200 528 L 384 518" stroke="#CBA96A" stroke-opacity="0.55" stroke-width="6" stroke-linecap="square"/>
  <path d="M1330 500 L 1460 500" stroke="#CBA96A" stroke-opacity="0.35" stroke-width="6" stroke-linecap="square"/>

  <g>
    <circle cx="492" cy="656" r="96" fill="none" stroke="url(#tk-body)" stroke-width="3"/>
    <rect x="446" y="610" width="92" height="92" rx="14" fill="none" stroke="url(#tk-detail)" stroke-width="1.8"/>
    <circle cx="492" cy="656" r="15" fill="#CBA96A" fill-opacity="0.3"/>
  </g>

  <g>
    <circle cx="1184" cy="656" r="96" fill="none" stroke="url(#tk-body)" stroke-width="3"/>
    <rect x="1138" y="610" width="92" height="92" rx="14" fill="none" stroke="url(#tk-detail)" stroke-width="1.8"/>
    <circle cx="1184" cy="656" r="15" fill="#CBA96A" fill-opacity="0.3"/>
  </g>
</svg>
